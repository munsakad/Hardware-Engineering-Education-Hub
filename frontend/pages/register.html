<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Hardware Engineering Education Hub</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="../index.html"><span class="chip">&#9633;</span> Hardware Engineering Education Hub</a>
      <ul class="nav-links">
        <li><a href="../index.html" data-page="index.html">Home</a></li>
        <li><a href="courses.html" data-page="courses.html">Courses</a></li>
        <li><a href="dashboard.html" data-page="dashboard.html">Dashboard</a></li>
        <li data-nav-auth style="display:flex; gap:1.25rem;"></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="form-card">
      <h1>Create Your Account</h1>
      <form id="register-form" novalidate>
        <p class="form-message" data-form-message></p>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required minlength="3" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required minlength="8" />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign Up</button>
      </form>
      <p class="form-footer">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <footer class="site-footer">
    &copy; 2026 Hardware Engineering Education Hub
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
